spring:
  application:
    name: pxvb-api
  datasource:
    url: ${PXVB_DB_URL:jdbc:mysql://localhost:3306/pxvb?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8mb4}
    username: ${PXVB_DB_USER:pxvb}
    password: ${PXVB_DB_PASSWORD:}
    hikari:
      # READ COMMITTED thay cho REPEATABLE READ mặc định của InnoDB để giảm gap-lock (SDD §2.5)
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Mỗi module thêm một location khi được tạo (db/migration/<module>)
    locations: classpath:db/migration/common,classpath:db/migration/identity,classpath:db/migration/workflow,classpath:db/migration/alerting,classpath:db/migration/dataio,classpath:db/migration/masterdata,classpath:db/migration/sync,classpath:db/migration/planning,classpath:db/migration/production,classpath:db/migration/material
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

pxvb:
  outbox:
    dispatcher:
      enabled: ${PXVB_OUTBOX_DISPATCHER:true}
  workflow:
    scanner:
      enabled: ${PXVB_WORKFLOW_SCANNER:true}
  alerting:
    scanner:
      enabled: ${PXVB_ALERT_SCANNER:true}
  sync:
    scanner:
      enabled: ${PXVB_SYNC_SCANNER:true}
  production:
    scanner:
      enabled: ${PXVB_PRODUCTION_SCANNER:true}
  material:
    scanner:
      enabled: ${PXVB_MATERIAL_SCANNER:true}
  mail:
    # Gửi email nội bộ (CRITICAL, yêu cầu chờ duyệt). Cần spring.mail.host/port/username/password khi bật.
    enabled: ${PXVB_MAIL_ENABLED:false}
    from: ${PXVB_MAIL_FROM:pxvb@localhost}
    base-url: ${PXVB_BASE_URL:}
  websocket:
    # Danh sách origin được phép, phân tách bằng dấu phẩy; production phải đặt cụ thể
    allowed-origins: ${PXVB_WS_ALLOWED_ORIGINS:*}
  security:
    # Bắt buộc, >= 32 byte. Đặt qua biến môi trường PXVB_SECURITY_JWT_SECRET, không commit giá trị thật.
    jwt-secret: ${PXVB_SECURITY_JWT_SECRET:}
    bootstrap-admin-password: ${PXVB_BOOTSTRAP_ADMIN_PASSWORD:}
