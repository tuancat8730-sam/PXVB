name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mysql: ["8.0", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test (MySQL ${{ matrix.mysql }})
        working-directory: src/backend
        run: ./mvnw -B -ntp verify -Dpxvb.test.mysql=${{ matrix.mysql }}
