<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>T-20 Soạn hàng NVL</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--brand:#174E86;--brand-soft:#E6EEF8;--ink:#16202B;--ink2:#3F4B5A;--ink3:#5E6A7A;--bg:#F3F5F8;--line:#D9DFE6;--line2:#B9C2CD;--ok:#1E7A46;--oks:#E2F3E9;--warn:#8A5A00;--warns:#FFF0C7;--bad:#B3261E;--bads:#FBE3E0;--off:#4A5666;--offs:#E6E9ED}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #F2B01E;outline-offset:2px}
.mono{font-family:'IBM Plex Mono',monospace}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border-radius:999px;font-size:18px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:12px;height:12px;background:currentColor;flex:none}
.c-ok{background:var(--oks);color:var(--ok)}.c-ok::before{border-radius:50%}
.c-bad{background:var(--bads);color:var(--bad)}
.c-warn{background:var(--warns);color:var(--warn)}.c-warn::before{clip-path:polygon(50% 0,100% 100%,0 100%);height:11px;width:14px}
.c-off{background:var(--offs);color:var(--off)}.c-off::before{background:none;border:3px solid currentColor;border-radius:50%;box-sizing:border-box}
.line{display:flex;align-items:center;gap:14px;min-height:80px;padding:8px 16px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:20px;text-align:left;width:100%;color:var(--ink)}
.line.sel{border-color:var(--brand);background:var(--brand-soft)}
.key{height:76px;border-radius:12px;border:2px solid var(--line2);background:#fff;font-size:32px;font-weight:600;color:var(--ink)}
.btn{height:64px;padding:0 28px;border-radius:12px;border:2px solid var(--line2);background:#fff;font-size:20px;font-weight:600;color:var(--ink)}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:var(--bg);display:flex;flex-direction:column">
  <div style="height:64px;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:28px;font-size:20px;flex:none">
    <b style="font-size:22px">Kho NVL</b><span>Phiếu <span class="mono">CP-2610-0142</span> · Lệnh <span class="mono">LSX-2610-014</span></span>
    <span style="flex:1"></span><span class="chip c-ok">Đã đồng bộ 15:28</span><b style="font-size:22px">15:30</b>
  </div>
  <div style="flex:1;display:flex;gap:24px;padding:24px;min-height:0">
    <section style="width:520px;display:flex;flex-direction:column;gap:12px">
      <h1 style="margin:0 0 4px;font-size:36px;line-height:44px">Soạn hàng</h1>
      <button class="line"><span style="flex:1"><b>Giấy vấn</b><br><span style="font-size:18px;color:var(--ink2)">120,0 kg · đã soạn 120,0</span></span><span class="chip c-ok">Đủ</span></button>
      <button class="line sel"><span style="flex:1"><b>Sợi thuốc</b><br><span style="font-size:18px;color:var(--ink2)">850,0 kg · đã soạn 600,0</span></span><span class="chip c-warn">Còn thiếu</span></button>
      <button class="line"><span style="flex:1"><b>Đầu lọc</b><br><span style="font-size:18px;color:var(--ink2)">1.200 cái · chưa soạn</span></span><span class="chip c-off">Chưa soạn</span></button>
      <span style="flex:1"></span>
      <button class="btn" style="height:72px;background:var(--offs);border-color:var(--offs);color:var(--off);cursor:not-allowed" disabled>Hoàn tất soạn hàng</button>
      <span style="font-size:18px;color:var(--ink2)">Còn 2 dòng chưa đủ. Soạn đủ rồi mới hoàn tất.</span>
    </section>
    <section style="flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px">
      <h2 style="margin:0;font-size:24px;line-height:30px">Sợi thuốc – số lượng soạn thêm</h2>
      <div style="display:flex;align-items:baseline;gap:12px;border:2px solid var(--brand);border-radius:12px;padding:8px 20px"><span class="mono" style="font-size:64px;line-height:72px;font-weight:500;flex:1;text-align:right">250,0</span><span style="font-size:28px;color:var(--ink2)">kg</span></div>
      <div style="display:flex;gap:12px;font-size:20px"><span class="chip c-ok">Khớp định mức</span><span style="color:var(--ink2);align-self:center">Cần 850,0 · đã soạn 600,0 · còn 250,0</span></div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;flex:1">
        <button class="key">7</button><button class="key">8</button><button class="key">9</button><button class="key" style="font-size:20px">Điền đủ</button>
        <button class="key">4</button><button class="key">5</button><button class="key">6</button><button class="key" style="font-size:20px">Xóa</button>
        <button class="key">1</button><button class="key">2</button><button class="key">3</button><button class="key">,</button>
        <button class="key" style="grid-column:span 3">0</button><button class="key" style="background:var(--brand);border-color:var(--brand);color:#fff;font-size:22px">Lưu</button>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
