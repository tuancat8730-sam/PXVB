<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>T-12 Cảnh báo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--brand:#174E86;--brand-soft:#E6EEF8;--ink:#16202B;--ink2:#3F4B5A;--bg:#F3F5F8;--line:#D9DFE6;--line2:#B9C2CD;--ok:#1E7A46;--oks:#E2F3E9;--warn:#8A5A00;--warns:#FFF0C7;--bad:#B3261E;--bads:#FBE3E0;--off:#4A5666;--offs:#E6E9ED}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #F2B01E;outline-offset:2px}
.mono{font-family:'IBM Plex Mono',monospace}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border-radius:999px;font-size:18px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:12px;height:12px;background:currentColor;flex:none}
.c-ok{background:var(--oks);color:var(--ok)}.c-ok::before{border-radius:50%}
.c-bad{background:var(--bads);color:var(--bad)}
.c-warn{background:var(--warns);color:var(--warn)}.c-warn::before{clip-path:polygon(50% 0,100% 100%,0 100%);height:11px;width:14px}
.c-off{background:var(--offs);color:var(--off)}.c-off::before{background:none;border:3px solid currentColor;border-radius:50%;box-sizing:border-box}
.al{display:flex;align-items:center;gap:16px;min-height:104px;padding:12px 20px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:22px}
.al .lv{width:96px;font-weight:700;font-size:24px}
.btn{height:64px;padding:0 28px;border-radius:12px;border:2px solid var(--line2);background:#fff;font-size:20px;font-weight:600;color:var(--ink)}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:var(--bg);display:flex;flex-direction:column">
  <div style="height:64px;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:28px;font-size:20px;flex:none">
    <b class="mono" style="font-size:22px">VM-04</b><span>Ca 2 · 18/10/2026</span>
    <span style="flex:1"></span><span class="chip c-ok">Đã đồng bộ 15:28</span><b style="font-size:22px">15:30</b>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;gap:12px;padding:24px;min-height:0">
    <div style="display:flex;align-items:center;gap:16px"><h1 style="margin:0;font-size:36px;line-height:44px;flex:1">Cảnh báo</h1><button class="btn" style="background:var(--brand);border-color:var(--brand);color:#fff">Chưa xác nhận (2)</button><button class="btn">Tất cả</button></div>
    <div class="al" style="border-color:var(--bad);background:var(--bads)"><span class="lv" style="color:var(--bad)">Cấp A</span><span style="flex:1"><b>Khối lượng điếu ngoài biên liên tiếp</b><br><span style="font-size:18px;color:var(--ink2)">Lượt KSCL 14:45 · 15:12</span></span><button class="btn" style="background:#fff">Xác nhận đã biết</button></div>
    <div class="al" style="border-color:#F2B01E;background:var(--warns)"><span class="lv" style="color:var(--warn)">Cấp B</span><span style="flex:1"><b>Sản lượng chậm so với kế hoạch giờ này</b><br><span style="font-size:18px;color:var(--ink2)">Giờ 15:00 · 15:05</span></span><button class="btn" style="background:#fff">Xác nhận đã biết</button></div>
    <div class="al"><span class="lv" style="color:var(--off)">Cấp C</span><span style="flex:1"><b>Tem còn dưới 100 chiếc</b><br><span style="font-size:18px;color:var(--ink2)">13:20</span></span><span class="chip c-ok">Đã biết 13:25</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
