<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>T-01 Đăng nhập nhanh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--brand:#174E86;--brand-soft:#E6EEF8;--ink:#16202B;--ink2:#3F4B5A;--ink3:#5E6A7A;--bg:#F3F5F8;--sf:#fff;--sf2:#F8FAFC;--line:#D9DFE6;--line2:#B9C2CD;--ok:#1E7A46;--oks:#E2F3E9;--warn:#8A5A00;--warns:#FFF0C7;--bad:#B3261E;--bads:#FBE3E0;--off:#4A5666;--offs:#E6E9ED}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #F2B01E;outline-offset:2px}
.mono{font-family:'IBM Plex Mono',monospace}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border-radius:999px;font-size:18px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:12px;height:12px;background:currentColor;flex:none}
.c-ok{background:var(--oks);color:var(--ok)}.c-ok::before{border-radius:50%}
.c-bad{background:var(--bads);color:var(--bad)}
.c-warn{background:var(--warns);color:var(--warn)}.c-warn::before{clip-path:polygon(50% 0,100% 100%,0 100%);height:11px;width:14px}
.c-off{background:var(--offs);color:var(--off)}.c-off::before{background:none;border:3px solid currentColor;border-radius:50%;box-sizing:border-box}
.key{height:84px;border-radius:12px;border:2px solid var(--line2);background:#fff;font-size:34px;font-weight:600;color:var(--ink)}
.user{display:flex;align-items:center;gap:16px;height:80px;padding:0 20px;border-radius:12px;border:2px solid var(--line2);background:#fff;font-size:22px;font-weight:600;text-align:left;color:var(--ink)}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:var(--bg);display:flex;flex-direction:column">
  <div style="height:64px;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:24px;font-size:20px;flex:none">
    <span class="mono" style="font-weight:500">TB-0412</span>
    <span style="color:var(--ink2)">Chưa gắn máy · chưa vào ca</span>
    <span style="flex:1"></span>
    <span class="chip c-ok">Đã đồng bộ 15:28</span>
    <span style="font-weight:600">18/10/2026 15:30</span>
  </div>
  <div style="flex:1;display:flex;gap:32px;padding:32px 40px;min-height:0">
    <section style="width:460px;display:flex;flex-direction:column;gap:12px">
      <h1 style="margin:0 0 4px;font-size:36px;line-height:44px">Ai đang dùng máy?</h1>
      <p style="margin:0 0 8px;font-size:20px;line-height:28px;color:var(--ink2)">Chạm tên của bạn rồi nhập mã PIN.</p>
      <button class="user" style="border-color:var(--brand);background:var(--brand-soft)"><span style="width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px">A</span><span style="flex:1">Nguyễn Văn A<br><span style="font-size:18px;font-weight:400;color:var(--ink2)">Công nhân vận hành</span></span></button>
      <button class="user"><span style="width:44px;height:44px;border-radius:50%;background:var(--offs);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px">B</span><span style="flex:1">Trần Thị B<br><span style="font-size:18px;font-weight:400;color:var(--ink2)">Công nhân vận hành</span></span></button>
      <button class="user"><span style="width:44px;height:44px;border-radius:50%;background:var(--offs);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px">C</span><span style="flex:1">Lê Văn C<br><span style="font-size:18px;font-weight:400;color:var(--ink2)">Lãnh đạo ca</span></span></button>
      <button class="user" style="border-style:dashed;justify-content:center;color:var(--brand)">Người khác · quét thẻ</button>
    </section>
    <section style="flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:32px 40px;display:flex;flex-direction:column;align-items:center;gap:20px">
      <h2 style="margin:0;font-size:24px;line-height:30px">Mã PIN của Nguyễn Văn A</h2>
      <div style="display:flex;gap:20px;height:32px;align-items:center" aria-label="Đã nhập 3 trên 6 chữ số">
        <span style="width:24px;height:24px;border-radius:50%;background:var(--ink)"></span>
        <span style="width:24px;height:24px;border-radius:50%;background:var(--ink)"></span>
        <span style="width:24px;height:24px;border-radius:50%;background:var(--ink)"></span>
        <span style="width:24px;height:24px;border-radius:50%;border:3px solid var(--line2);box-sizing:border-box"></span>
        <span style="width:24px;height:24px;border-radius:50%;border:3px solid var(--line2);box-sizing:border-box"></span>
        <span style="width:24px;height:24px;border-radius:50%;border:3px solid var(--line2);box-sizing:border-box"></span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:420px">
        <button class="key">1</button><button class="key">2</button><button class="key">3</button>
        <button class="key">4</button><button class="key">5</button><button class="key">6</button>
        <button class="key">7</button><button class="key">8</button><button class="key">9</button>
        <button class="key" style="font-size:22px">Xóa hết</button><button class="key">0</button><button class="key" style="font-size:22px">Xóa 1</button>
      </div>
      <button style="width:420px;height:72px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-size:24px;font-weight:700">Vào</button>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
